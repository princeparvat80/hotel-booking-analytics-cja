<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripNest - Book Hotels & Stays</title>
    <meta name="description" content="TripNest: find and book hotels, resorts and stays worldwide." />

    <!--
      Adobe Client Data Layer.
      The website pushes every tracked interaction here. The Adobe Data
      Collection (Tags / Launch) property reads this data layer and sends the
      events to Adobe Analytics via the Web SDK + datastream.
    -->
    <script>
      window.adobeDataLayer = window.adobeDataLayer || [];
    </script>

    <!--
      ADOBE TAGS (LAUNCH) EMBED  — paste your property's embed code here.
      Get it from Data Collection > Tags > <your property> > Environments.
      Example (replace with your real embed URL):

      <script src="https://assets.adobedtm.com/XXXXXXXX/XXXXXXXX/launch-XXXXXXXX-development.min.js" async></script>

      Until this is added, the site runs in DATA-LAYER-ONLY mode: every event is
      logged to the console and visible via window.adobeDataLayer, but nothing is
      sent to Adobe yet. That is expected and useful for walking through the flow.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
