      Adobe Client Data Layer.
      The website pushes every tracked interaction here. The Adobe Data
      Collection (Tags / Launch) property reads this data layer and sends the
      events to Adobe Analytics via the Web SDK + datastream.
    -->
    <script>
      window.adobeDataLayer = window.adobeDataLayer || [];
    </script>

    <!--
      ADOBE TAGS (LAUNCH) EMBED — Prince - TripNest Web (Development environment).
      Loads the Web SDK + Adobe Client Data Layer extensions and the rules that
      forward events to the datastream (Prince - TripNest Web SDK) and on to
      Adobe Analytics (report suite aeptripnestprince).
    -->
    <script src="https://assets.adobedtm.com/6a203c8a0ff8/c29a0e84645c/launch-4dc8cd6d2a9d-development.min.js" async></script>
